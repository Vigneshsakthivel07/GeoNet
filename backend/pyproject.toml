[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "geonet-backend"
version = "0.1.0"
description = "GeoNet land intelligence backend foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.12,<0.116",
  "uvicorn>=0.34.2,<0.35",
  "psycopg[binary]>=3.2.6,<3.3",
  "redis>=5.2.1,<6",
  "boto3>=1.37,<2",
  "prometheus-client>=0.21.1,<0.22",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<0.29",
  "pytest>=8.3.5,<9",
  "pytest-cov>=6.1.1,<7",
  "ruff>=0.11.6,<0.12",
  "mypy>=1.15,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["app/legacy/engine.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
files = ["app/main.py"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
